name: Apply restore points
on:
  push:
    branches: [restore-points-v0.7.0]
    paths:
      - tools/apply_restore_points.py
      - .github/workflows/apply-restore-points.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: restore-points-v0.7.0
      - name: Apply guarded patch
        run: python3 tools/apply_restore_points.py
      - name: Validate embedded JavaScript
        run: |
          node <<'NODE'
          const fs=require('fs');
          const h=fs.readFileSync('index.html','utf8');
          const m=h.match(/<script>([\s\S]*)<\/script>/);
          if(!m) throw new Error('Embedded script not found');
          new Function(m[1]);
          for(const marker of ['v0.7.0','btnCreateRestorePoint','restorePointsModal','LS_RESTORE_POINTS']) if(!h.includes(marker)) throw new Error('Missing '+marker);
          console.log('JavaScript and feature markers validated');
          NODE
      - name: Commit validated application
        run: |
          rm -f tools/apply_restore_points.py .github/workflows/apply-restore-points.yml
          rmdir tools 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Checking v0.6.5 -> v0.7.0: add restore points"
          git push origin HEAD:restore-points-v0.7.0
